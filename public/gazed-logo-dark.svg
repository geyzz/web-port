<?xml version="1.0" encoding="UTF-8"?>
<svg width="540" height="300" viewBox="0 0 520 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Top Face Metallic Gradient (Left G) -->
    <linearGradient id="gazeTopGrad_dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#D1D9E0" />
      <stop offset="100%" stop-color="#7A889B" />
    </linearGradient>

    <!-- Side Chamfer Gradient (Left G) -->
    <linearGradient id="gazeSideGrad_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D1D9E0" />
      <stop offset="100%" stop-color="#3E4957" />
    </linearGradient>

    <!-- Right D Front Gradient -->
    <linearGradient id="gazeRightGrad_dark" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#D1D9E0" />
      <stop offset="85%" stop-color="#7A889B" />
      <stop offset="100%" stop-color="#3E4957" />
    </linearGradient>

    <!-- Crossbar Inner Glow -->
    <linearGradient id="gazeCrossbarGrad_dark" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7A889B" />
      <stop offset="60%" stop-color="#D1D9E0" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Soft Depth Ambient Shadow -->
    <filter id="gazeEmblemShadow_dark" x="-15%" y="-15%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g transform="translate(150, 20)" filter="url(#gazeEmblemShadow_dark)">
    <!-- === THE GD ISOMETRIC HEXAGONAL RIBBON === -->
    
    <!-- Outer G Loop (Left side of hexagon) -->
    <!-- Top slope -> Outer Left vertical -> Bottom slope -> Up into center G spur -->
    <path
      d="M 110,48
         L 62,20
         C 55,16 46,16 39,20
         L 8,38
         C 2,42 0,48 0,56
         L 0,118
         C 0,126 3,133 9,137
         L 48,160
         C 55,164 64,164 71,160
         L 106,140
         C 112,136 116,130 116,122
         L 116,104
         C 116,98 112,94 106,94
         L 68,94
         C 62,94 58,98 58,104
         C 58,110 62,114 68,114
         L 94,114
         L 94,122
         L 64,139
         C 60,141 55,141 51,139
         L 24,123
         C 22,122 21,119 21,116
         L 21,58
         C 21,55 22,53 24,51
         L 48,37
         C 52,35 58,35 62,37
         L 95,56
         Z"
      fill="url(#gazeTopGrad_dark)"
    />

    <!-- Left Chamfer Bevel Highlight (Architectural bevel) -->
    <path
      d="M 62,20
         L 8,38
         C 2,42 0,48 0,56
         L 0,118
         C 0,126 3,133 9,137
         L 16,133
         L 16,56
         L 56,32
         Z"
      fill="url(#gazeSideGrad_dark)"
      opacity="0.38"
    />

    <!-- Interlocking Ribbon Twist / Overlap seam (Ribbon folds from G into D) -->
    <path
      d="M 94,56
         L 110,48
         C 116,44 122,44 128,48
         L 138,54
         L 122,64
         L 108,56
         Z"
      fill="#FFFFFF"
      opacity="0.85"
    />

    <!-- Outer D Loop (Right side of hexagon) -->
    <!-- Continues from central spine -> Top right facet -> Outer Right vertical -> Bottom right facet -> Meets back at central spine -->
    <path
      d="M 120,54
         L 155,74
         C 162,78 171,78 178,74
         L 209,56
         C 216,52 220,45 220,37
         L 220,-25
         C 220,-33 216,-40 210,-44
         L 171,-67
         C 164,-71 155,-71 148,-67
         L 113,-47
         C 107,-43 103,-37 103,-29
         L 103,32
         C 103,40 107,46 113,50
         Z"
      transform="translate(0, 75)"
      fill="url(#gazeRightGrad_dark)"
    />

    <!-- Clean Cutout Window for D Loop (creates the hollow volumetric ribbon) -->
    <path
      d="M 124,66
         L 124,114
         C 124,117 126,120 128,121
         L 156,137
         C 160,139 166,139 170,137
         L 194,123
         C 197,121 199,118 199,114
         L 199,66
         C 199,62 197,59 194,57
         L 170,43
         C 166,41 160,41 156,43
         L 128,59
         C 126,60 124,63 124,66
         Z"
      fill="#141515"
    />

    <!-- Inner Core D Ribbon (Front chamfered ring) -->
    <path
      d="M 143,62
         L 143,118
         L 163,129
         C 166,131 170,131 173,129
         L 182,124
         L 182,60
         L 173,55
         C 170,53 166,53 163,55
         Z"
      fill="url(#gazeTopGrad_dark)"
      opacity="0.9"
    />
  </g>

  
  <!-- === WORDMARK: gaze.d === -->
  <g transform="translate(260, 215)">
    <!-- Base Typography -->
    <text
      x="0"
      y="0"
      font-family="'Syne', 'Plus Jakarta Sans', -apple-system, sans-serif"
      font-size="64"
      font-weight="800"
      letter-spacing="-0.035em"
      fill="#F4F5F6"
      text-anchor="middle"
    >gaze<tspan fill="#9EB6D0">.</tspan>d</text>

    <!-- Subtitle: SPATIAL &amp; 3D DESIGN STUDIO -->
    <text
      x="0"
      y="28"
      font-family="'Plus Jakarta Sans', sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="0.32em"
      fill="#8A99A8"
      text-anchor="middle"
    >SPATIAL &amp; FRONT-END CRAFT</text>
  </g>
  
</svg>